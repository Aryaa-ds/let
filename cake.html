<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Make a Wish</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="cake.css">
</head>

<body>

  <main class="page-wrapper">

    <section class="paper">

      <!-- DEKORASI -->
      <div class="decor decor-top"></div>
      <div class="decor decor-bottom"></div>


      <!-- HEADER -->
      <header class="header">

        <p class="eyebrow">
          ONE LAST THING
        </p>

        <h1>
          Make a
          <span>Wish</span>
        </h1>

        <p class="subtitle">
          tiup lilinnya, lalu buat satu permintaan
        </p>

      </header>


      <!-- CAKE -->
      <section class="cake-scene">

        <!-- LILIN -->
        <div class="candles">

          <div class="candle">
            <div class="smoke"></div>
            <div class="flame"></div>
          </div>

          <div class="candle">
            <div class="smoke"></div>
            <div class="flame"></div>
          </div>

          <div class="candle">
            <div class="smoke"></div>
            <div class="flame"></div>
          </div>

        </div>


        <!-- KUE -->
        <div class="cake">

          <div class="tier tier-top">
            <div class="frosting"></div>
          </div>

          <div class="tier tier-bottom">
            <div class="frosting"></div>
          </div>

          <div class="plate"></div>

        </div>

      </section>


      <!-- TOMBOL TIUP -->
      <button id="blowBtn" class="blow-btn">
        T I U P &nbsp; L I L I N N Y A
      </button>


      <!-- UCAPAN -->
      <p id="wishMessage" class="wish-message">
        semoga semua harapanmu satu per satu menemukan jalannya ♡
      </p>


    </section>

  </main>


  <!-- KEMBANG API -->
  <div id="fireworks" class="fireworks"></div>


  <!-- HUJAN KELOPAK -->
  <div id="petals" class="petals"></div>


  <script src="cake.js"></script>

</body>

</html>
