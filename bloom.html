<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="bloom.css">
</head>

<body>

  <main class="page-wrapper">

    <section class="paper">

      <!-- DEKORASI -->
      <div class="decor decor-top"></div>
      <div class="decor decor-bottom"></div>


      <!-- HEADER -->
      <header class="header">

        <p class="eyebrow">
          A LITTLE GARDEN
        </p>

        <h1 class="greeting">
          <span class="word">Happy</span>
          <span class="word">Birthday</span>
          <br>
          <span class="word accent">Sayang</span>
        </h1>

        <p class="subtitle">
          tap tiap bunga untuk membuatnya mekar
        </p>

      </header>


      <!-- GARDEN -->
      <section class="garden">

        <div class="flower">
          <div class="bloom">
            <span class="petal"></span>
            <span class="petal"></span>
            <span class="petal"></span>
            <span class="petal"></span>
            <span class="petal"></span>
            <span class="petal"></span>
            <span class="core"></span>
          </div>
          <div class="stem"></div>
          <span class="leaf leaf-left"></span>
          <span class="leaf leaf-right"></span>
        </div>

        <div class="flower">
          <div class="bloom">
            <span class="petal"></span>
            <span class="petal"></span>
            <span class="petal"></span>
            <span class="petal"></span>
            <span class="petal"></span>
            <span class="petal"></span>
            <span class="core"></span>
          </div>
          <div class="stem"></div>
          <span class="leaf leaf-left"></span>
          <span class="leaf leaf-right"></span>
        </div>

        <div class="flower">
          <div class="bloom">
            <span class="petal"></span>
            <span class="petal"></span>
            <span class="petal"></span>
            <span class="petal"></span>
            <span class="petal"></span>
            <span class="petal"></span>
            <span class="core"></span>
          </div>
          <div class="stem"></div>
          <span class="leaf leaf-left"></span>
          <span class="leaf leaf-right"></span>
        </div>

        <div class="flower">
          <div class="bloom">
            <span class="petal"></span>
            <span class="petal"></span>
            <span class="petal"></span>
            <span class="petal"></span>
            <span class="petal"></span>
            <span class="petal"></span>
            <span class="core"></span>
          </div>
          <div class="stem"></div>
          <span class="leaf leaf-left"></span>
          <span class="leaf leaf-right"></span>
        </div>

      </section>


      <!-- CLOSING -->
      <div id="closing" class="closing">

        <div class="line"></div>

        <p>
          selamat ulang tahun, sayang.
        </p>

        <div class="heart">
          ♡
        </div>

        <div class="back-wrapper">

          <a href="index.html">
            ULANGI DARI AWAL
          </a>

        </div>

      </div>

    </section>

  </main>


  <script src="bloom.js"></script>

</body>

</html>
