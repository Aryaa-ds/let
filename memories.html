<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Memories</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="memories.css">
</head>

<body>

  <main class="page-wrapper">

    <section class="paper">

      <!-- DEKORASI -->
      <div class="decor decor-top"></div>
      <div class="decor decor-bottom"></div>


      <!-- HEADER -->
      <header class="header">

        <p class="eyebrow">
          LITTLE MOMENTS
        </p>

        <h1>
          Our
          <span>Memories</span>
        </h1>

        <p class="subtitle">
          beberapa hal kecil yang layak untuk diingat
        </p>

      </header>


      <!-- FOTO -->
      <section class="memory-container">

        <!-- FOTO 1 -->
        <div class="memory-card card-one">

          <div class="photo">
            <img
              src="img2.jpg"
              alt="Memory 1"
            >
          </div>

          <p class="memory-number">
            01
          </p>

          <p class="memory-caption">
            a little moment
          </p>

        </div>


        <!-- FOTO 2 -->
        <div class="memory-card card-two">

          <div class="photo">
            <img
              src="img1.jpg"
              alt="Memory 2"
            >
          </div>

          <p class="memory-number">
            02
          </p>

          <p class="memory-caption">
            another little story
          </p>

        </div>


        <!-- FOTO 3 -->
        <div class="memory-card card-three">

          <div class="photo">
            <img
              src="img3.jpg"
              alt="Memory 3"
            >
          </div>

          <p class="memory-number">
            03
          </p>

          <p class="memory-caption">
            something worth remembering
          </p>

        </div>

      </section>


      <!-- CLOSING -->
      <section class="closing">

        <div class="line"></div>

        <p>
          and maybe,
          <br>
          there are still many memories
          <br>
          waiting to be made.
        </p>

        <div class="heart">
          ♡
        </div>

      </section>


      <!-- BACK -->
      <div class="back-wrapper">

        <a href="cake.html" class="back-link">
          Next
        </a>

      </div>

    </section>

  </main>

</body>
</html>
